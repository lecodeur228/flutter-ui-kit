name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  ui_kit:
    name: Analyze · Test · Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Pub get (ui_kit)
        working-directory: packages/ui_kit
        run: flutter pub get

      - name: Analyze ui_kit
        working-directory: packages/ui_kit
        run: flutter analyze --fatal-infos

      - name: Test ui_kit
        working-directory: packages/ui_kit
        run: flutter test

      - name: Pub get (demo_app)
        working-directory: apps/demo_app
        run: flutter pub get

      - name: Analyze demo_app
        working-directory: apps/demo_app
        run: flutter analyze --fatal-infos

      - name: Build demo_app (web)
        working-directory: apps/demo_app
        run: flutter build web --release
